<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饭搭 - API 服务</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(135deg,#FFF8F0 0%,#FFF3E6 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:40px}
.logo{font-size:80px;margin-bottom:20px;display:block}
h1{font-size:32px;font-weight:800;color:#FF6B35;margin-bottom:8px}
.subtitle{font-size:16px;color:#999;margin-bottom:40px}
.status{display:inline-flex;align-items:center;gap:8px;background:#fff;padding:12px 24px;border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:32px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#52C41A;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.status-text{font-size:14px;color:#333;font-weight:500}
.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.link-card{background:#fff;padding:20px 28px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);text-decoration:none;color:#333;transition:transform .2s,box-shadow .2s;min-width:160px}
.link-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.link-icon{font-size:32px;display:block;margin-bottom:10px}
.link-title{font-size:16px;font-weight:600;color:#FF6B35}
.link-desc{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>
<div class="container">
  <span class="logo">🍽️</span>
  <h1>饭搭</h1>
  <p class="subtitle">和喜欢的人一起吃饭</p>
  <div class="status">
    <span class="status-dot"></span>
    <span class="status-text">服务运行中</span>
  </div>
  <div class="links">
    <a href="/admin/" class="link-card">
      <span class="link-icon">⚙️</span>
      <span class="link-title">后台管理</span>
      <span class="link-desc">数据管理 & 统计</span>
    </a>
    <a href="/api/v1/auth/login" class="link-card">
      <span class="link-icon">🔌</span>
      <span class="link-title">API 接口</span>
      <span class="link-desc">REST API v1</span>
    </a>
  </div>
</div>
</body>
</html>
